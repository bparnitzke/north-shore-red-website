name: Refresh social feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch current posts
        env:
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          SOCIAL_META_PAGE_ID: "158689294189935"
          SOCIAL_INSTAGRAM_USER_ID: "17841429608306451"
          SOCIAL_META_ACCESS_TOKEN: ${{ secrets.SOCIAL_META_ACCESS_TOKEN }}
          SOCIAL_X_USER_ID: "2045973729260298240"
          SOCIAL_X_BEARER_TOKEN: ${{ secrets.SOCIAL_X_BEARER_TOKEN }}
        run: node scripts/sync-social.mjs
      - name: Commit updated feed
        run: |
          if git diff --quiet -- src/data/social.generated.json; then
            echo "Feed is already current."
            exit 0
          fi
          git config user.name "north-shore-red-feed"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/social.generated.json
          git commit -m "Refresh social feed"
          git push
